<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HaiChau Hotspots · Bản đồ kiểu khu vực</title>
<meta name="theme-color" content="#11171D">
<meta name="description" content="HaiChau Hotspots — phân tích khu vực ẩm thực Đà Nẵng theo cơ cấu loại hình kinh doanh.">
<link rel="icon" type="image/svg+xml" href="brand/hch-app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* HaiChau Hotspots — bố cục theo mẫu MarketMap: thanh trên + bộ lọc nền tối, bản đồ 3D ở giữa, thẻ chi tiết nổi bên phải.
   Màu lấy từ bộ nhận diện brand/: xanh #4A90B5 · ngọc #5CC3C1 · cam san hô #F28C5B · cát #F7CF8F · mực #1F3A4D · kem #FAEBD3
   (bản tối: #7FB7D6 · #6FD6D3 · #FF9F73 · chữ #F3EEE6 · nền #11171D). Thẻ sáng là mặc định; menu tài khoản đổi sang tối. */
:root{
  --chrome:#11171D; --chrome-2:#172029; --chrome-3:#1F2A35; --chrome-line:#2A3743; --chrome-ink:#F3EEE6; --chrome-muted:#9AA8B4;
  --b-blue:#4A90B5; --b-teal:#5CC3C1; --b-coral:#F28C5B; --b-sand:#F7CF8F; --b-cream:#FAEBD3;
  --accent:#2E6E92; --accent-ink:#2A6688; --accent-soft:#E2EFF6; --on-accent:#FFFFFF;
  --card:#FFFFFF; --card-2:#F8F4EC; --card-line:#ECE5D8; --card-ink:#1F3A4D; --card-muted:#56697A;
  --navy:#1F3A4D; --star:#B9770E;
  --shadow:0 10px 30px rgba(15,27,46,.18); --shadow-sm:0 2px 8px rgba(15,27,46,.18);
  --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --accent:#7FB7D6; --accent-ink:#9CCBE5; --accent-soft:#1B3241; --on-accent:#11171D;
  --card:#172029; --card-2:#1F2A35; --card-line:#2A3743; --card-ink:#F3EEE6; --card-muted:#9AA8B4;
  --star:#F7CF8F; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--card-ink);font:400 14px/1.45 var(--font-ui);font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.page{display:grid;grid-template-rows:72px 1fr;height:100%}
.shell{display:grid;grid-template-columns:280px 1fr;min-height:0}

/* ---------- Thanh trên ---------- */
.topbar{display:grid;grid-template-columns:280px 1fr 280px;align-items:center;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid var(--chrome-line);padding:0 24px 0 22px;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.brand .logo{display:block;height:29px;width:auto;margin-bottom:5px}
.brand small{display:block;font-size:12.5px;color:var(--chrome-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:100%;max-width:582px;justify-self:center}
.search input{width:100%;height:42px;border:1px solid transparent;background:#FFFFFF;color:#1F3A4D;border-radius:12px;padding:0 46px 0 18px;font:400 14.5px var(--font-ui);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:box-shadow .2s var(--ease)}
.search input:focus{outline:none;box-shadow:0 0 0 3px rgba(127,183,214,.55)}
.search input::placeholder{color:#6B7689}
.search>svg{position:absolute;right:15px;top:12px;width:18px;height:18px;color:#1F3A4D;pointer-events:none}
.results{position:absolute;left:0;right:0;top:50px;background:var(--card);color:var(--card-ink);border:1px solid var(--card-line);border-radius:12px;box-shadow:0 12px 32px rgba(15,27,46,.22);padding:6px;list-style:none;margin:0;max-height:400px;overflow:auto;z-index:40;animation:pop .16s var(--ease)}
.results li button{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13.5px}
.results li button:hover,.results li button[aria-selected="true"]{background:var(--card-2)}
.results .dot{width:10px;height:10px;border-radius:50%}
.results .kind{font-size:11px;color:var(--card-muted)}
.results .sub{display:block;font-size:11.5px;color:var(--card-muted)}
.results .none{padding:10px;color:var(--card-muted);font-size:13px}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:14px;position:relative}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--chrome-ink);transition:background .15s}
.icon-btn:hover{background:var(--chrome-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .badge{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--b-coral);box-shadow:0 0 0 2px var(--chrome)}
.user{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:4px 6px 4px 4px;border-radius:999px;cursor:pointer;color:var(--chrome-ink);transition:background .15s}
.user:hover{background:var(--chrome-2)}
.avatar img{display:block}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--b-cream);color:var(--navy);font-weight:600;font-size:14.5px;letter-spacing:.02em}
.user .name{font-size:14.5px;font-weight:500;white-space:nowrap}
.user svg{width:16px;height:16px;color:var(--chrome-muted)}
.menu{position:absolute;top:52px;right:0;width:320px;background:var(--card);color:var(--card-ink);border:1px solid var(--card-line);border-radius:14px;box-shadow:0 16px 40px rgba(15,27,46,.28);padding:8px;z-index:50;animation:pop .16s var(--ease);transform-origin:top right}
.menu h4{margin:6px 10px 8px;font-size:12px;font-weight:600;color:var(--card-muted);text-transform:uppercase;letter-spacing:.05em}
.menu .item{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:10px;font-size:13.5px;cursor:pointer}
.menu .item:hover{background:var(--card-2)}
.menu .item svg{width:18px;height:18px;color:var(--card-muted)}
.menu .item small{display:block;color:var(--card-muted);font-size:12px;margin-top:1px}
.menu .item .state{font-size:12px;color:var(--card-muted)}
.menu hr{border:0;border-top:1px solid var(--card-line);margin:6px 4px}
.notes{list-style:none;margin:0;padding:0}
.notes li{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:10px;font-size:13px;line-height:1.5;border-radius:9px}
.notes li+li{border-top:1px solid var(--card-line);border-radius:0}
.notes li i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--accent)}
.notes li i.warn{background:#F59E0B}
.notes small{display:block;color:var(--card-muted);font-size:12px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Bộ lọc (trái, nền navy) ---------- */
.filters{background:var(--chrome);color:var(--chrome-ink);overflow:auto;padding:20px 22px 22px;scrollbar-width:thin;scrollbar-color:var(--chrome-line) transparent}
.filters h2{font-size:17px;font-weight:600;margin:0 0 16px}
.fgroup{margin-bottom:20px}
.fl{display:block;font-size:14px;font-weight:500;margin:0 0 9px}
.sel{position:relative}
.sel svg.lead{position:absolute;left:13px;top:12px;width:18px;height:18px;color:var(--chrome-ink);pointer-events:none}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:42px;border:1px solid var(--chrome-line);border-radius:10px;background:var(--chrome-2);color:var(--chrome-ink);padding:0 36px 0 42px;font:400 13.5px var(--font-ui);cursor:pointer;transition:border-color .15s,background .15s;text-overflow:ellipsis}
.sel select:hover{border-color:#3D4C5B;background:var(--chrome-3)}
.sel select option{color:#1F3A4D;background:#fff}
.sel::after{content:"";position:absolute;right:16px;top:15px;width:7px;height:7px;border-right:2px solid var(--chrome-ink);border-bottom:2px solid var(--chrome-ink);transform:rotate(45deg);pointer-events:none}
.cats{display:grid;gap:1px}
.cat{display:grid;grid-template-columns:20px 18px 1fr 20px;gap:10px;align-items:center;padding:6px 0;font-size:14px;border-radius:8px;transition:background .15s}
.cat .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.cat input{appearance:none;-webkit-appearance:none;width:19px;height:19px;margin:0;border-radius:5px;border:1.5px solid #46525E;background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
.cat input::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s var(--ease)}
.cat input:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.cat input[data-k="map"]:checked{background:#6B7A88;border-color:#6B7A88}
.cat input[data-k="chart"]:checked{background:var(--b-blue);border-color:var(--b-blue)}
.cats-head{display:grid;grid-template-columns:20px 18px 1fr 20px;gap:10px;font-size:11px;color:var(--chrome-muted);margin-bottom:2px}
.cats-head span:last-child{grid-column:4;justify-self:end;white-space:nowrap}
.cats-head span:first-child{grid-column:1/4;white-space:nowrap}
.switch{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:#2F3B47;position:relative;margin:0;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.switch input:checked{background:var(--b-blue)}
.switch input:checked::after{transform:translateX(14px)}
.btn-outline{width:100%;height:42px;display:flex;align-items:center;justify-content:center;gap:9px;background:transparent;color:var(--chrome-ink);border:1px solid #33414E;border-radius:10px;cursor:pointer;font-size:14px;margin-top:8px;transition:background .15s,transform .1s}
.btn-outline:hover{background:var(--chrome-2)}
.btn-outline:active{transform:scale(.98)}
.btn-outline svg{width:17px;height:17px}
.model-note{margin:16px 0 0;font-size:11.5px;line-height:1.6;color:var(--chrome-muted)}
.model-note a{color:var(--chrome-muted)}

/* ---------- Bản đồ ---------- */
.map-wrap{position:relative;min-width:0;background:#F1EBE1;overflow:hidden}
#map{position:absolute;inset:0}
.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(180deg,#F6F1E8,#ECE4D7);transition:opacity .5s var(--ease)}
.loading.done{opacity:0;pointer-events:none}
.loading div{display:flex;align-items:center;gap:12px;color:#1F3A4D;font-size:13.5px;background:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-sm)}
.loading i{width:18px;height:18px;border-radius:50%;border:2.5px solid #E2D9CA;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mctl{position:absolute;z-index:10;display:flex;gap:10px}
.mctl.tl{top:22px;left:18px;flex-direction:column}
.mctl.br{bottom:76px;right:406px;flex-direction:column;align-items:center;gap:14px}
.north{width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s}
.north:hover{transform:scale(1.05)}
.north svg{width:26px;height:26px}
.mbtn{width:38px;height:38px;display:grid;place-items:center;background:#FFFFFF;color:#1F3A4D;border:0;border-radius:9px;box-shadow:var(--shadow-sm);cursor:pointer;transition:background .15s,transform .1s}
.mbtn:hover{background:#F8F4EC}
.mbtn:active{transform:scale(.95)}
.mbtn svg{width:20px;height:20px}
.mbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.zoom-group{display:flex;flex-direction:column;background:#fff;border-radius:9px;box-shadow:var(--shadow-sm);overflow:hidden}
.zoom-group .mbtn{box-shadow:none;border-radius:0}
.zoom-group .mbtn+.mbtn{border-top:1px solid #ECE5D8}
/* Hàng đáy bản đồ: thước tỷ lệ bên trái, chú thích loại hình ở giữa */
.bottombar{position:absolute;z-index:10;left:18px;right:420px;bottom:16px;display:flex;align-items:flex-end;gap:14px;pointer-events:none}
.bottombar>*{pointer-events:auto}
.scalebar{flex:none;background:rgba(255,255,255,.96);color:#1F3A4D;border-radius:10px;box-shadow:var(--shadow-sm);padding:9px 16px 10px}
.scalebar .lbls{position:relative;height:14px;font-size:11px}
.scalebar .lbls span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scalebar .bar{height:7px;border:1.5px solid #1F3A4D;border-top:0;margin-top:2px;position:relative;transition:width .2s}
.scalebar .bar i{position:absolute;top:0;bottom:0;width:1.5px;background:#1F3A4D}
.legend{margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;align-items:center;background:rgba(255,255,255,.96);color:#1F3A4D;border-radius:12px;box-shadow:var(--shadow-sm);padding:12px 18px;font-size:12px;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.maplibregl-ctrl-attrib{display:none}
.maplibregl-popup{animation:pop .18s var(--ease)}
.maplibregl-popup-content{background:var(--card);color:var(--card-ink);border-radius:12px;box-shadow:0 10px 30px rgba(15,27,46,.25);padding:12px 14px;font:13px/1.5 var(--font-ui);min-width:210px}
.maplibregl-popup-tip{border-top-color:var(--card)!important;border-bottom-color:var(--card)!important}
.maplibregl-popup-close-button{color:var(--card-muted);font-size:18px;padding:2px 8px}
.pn{font-weight:600;font-size:14px;padding-right:14px}
.pm{color:var(--card-muted)}
.pq{color:var(--card-muted);font-style:italic;margin-top:4px}
.star{color:var(--star)}
.draw-layer{position:absolute;inset:0;z-index:8;cursor:crosshair;touch-action:none;outline:2px dashed var(--accent);outline-offset:-2px}
.draw-layer svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.draw-hint{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
.toast{position:absolute;z-index:30;left:50%;top:22px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:pop .2s var(--ease)}

/* ---------- Thẻ chi tiết (phải, nổi trên bản đồ) ---------- */
.detail{position:absolute;z-index:12;top:8px;right:8px;bottom:8px;width:378px;background:var(--card);color:var(--card-ink);border-radius:14px;box-shadow:var(--shadow);overflow:auto;overscroll-behavior:contain;padding:20px 22px 24px;scrollbar-width:thin;scrollbar-color:var(--card-line) transparent}
.detail>.in{animation:fadeIn .28s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dhead h2{font-size:18px;font-weight:600;margin:0}
.x{border:0;background:none;color:var(--card-muted);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.x:hover{background:var(--card-2);color:var(--card-ink)}
.x svg{width:18px;height:18px}
.zrow{display:flex;align-items:center;gap:10px;padding:8px 0 2px}
.zrow .dot{width:14px;height:14px;border-radius:50%;flex:none}
.zrow b{font-size:15.5px;font-weight:600}
.zrow .pill{margin-left:auto;font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.zsub{font-size:12.5px;color:var(--card-muted);margin:2px 0 4px 24px}
.sec{padding:18px 0;border-bottom:1px solid var(--card-line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:14.5px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 small{font-size:11.5px;font-weight:400;color:var(--card-muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grow{transform-box:fill-box;transform-origin:bottom;animation:grow .55s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap;z-index:5;transform:translate(-50%,-100%)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.rows li{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:center;font-size:14px;padding:5px 0}
.rows .dot{width:16px;height:16px;border-radius:50%}
.rows .v{font-weight:600}
.rows .v small{color:var(--card-muted);font-weight:400;margin-left:8px;display:inline-block;min-width:44px;text-align:right}
.rows li.link{cursor:pointer;border-radius:8px;padding:6px 8px;margin:0 -8px;transition:background .15s}
.rows li.link:hover{background:var(--card-2)}
.boxes{display:grid;grid-template-columns:1fr 1fr;background:var(--card-2);border:1px solid var(--card-line);border-radius:12px;margin-top:16px}
.box{padding:12px 14px;display:grid;grid-template-columns:22px 1fr;gap:3px 12px;align-items:center}
.box+.box{border-left:1px solid var(--card-line)}
.box svg{width:20px;height:20px;color:var(--card-muted);grid-row:span 2}
.box span{font-size:11.5px;color:var(--card-muted)}
.box b{font-size:15px;font-weight:600}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card-2);border-radius:10px;padding:3px;margin-bottom:14px}
.tabs .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:var(--accent);border-radius:8px;box-shadow:0 1px 3px rgba(46,110,146,.35);transition:transform .25s var(--ease)}
.tabs button{position:relative;border:0;background:none;border-radius:8px;padding:8px 0;font-size:13px;cursor:pointer;color:var(--card-muted);transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--on-accent);font-weight:500}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12px;color:var(--card-muted)}
.leg span{display:inline-flex;align-items:center;gap:7px}
.leg i{width:9px;height:9px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--card-2);border:1px solid var(--card-line)}
.top{list-style:none;margin:0;padding:0}
.top li+li{border-top:1px solid var(--card-line)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;width:calc(100% + 16px);margin:0 -8px;padding:9px 8px;text-align:left;background:none;border:0;border-radius:8px;font-size:13.5px;cursor:pointer;transition:background .15s}
.sp:hover{background:var(--card-2)}
.sp[aria-pressed="true"]{background:var(--accent-soft)}
.sp .p{font-size:12px;color:var(--card-muted);white-space:nowrap}
.note{font-size:12.5px;color:var(--card-muted);margin:0}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);background:var(--card-2);border:1px solid var(--card-line);border-radius:12px}

  map.getSource("zlabels").setData({ type: "FeatureCollection", features: ZONES.filter((z) => (sel.kind === "zone" && sel.z === z.id) || (show && hasBars(z))).map((z) => {

}

/* ---------- Bộ lọc ---------- */

function applyFilters(animate = true) {

  map.setLayoutProperty("bars", "visibility", vis($("t-bars").checked));
  map.setLayoutProperty("shadows", "visibility", vis($("t-bars").checked));

}
const orderedIds = (list, id, on) => CATS.map((x) => x.id).filter((c) => c === id ? on : list.includes(c));
$("f-cats").addEventListener("change", (e) => {

["t-zones", "t-bars", "t-labels"].forEach((id) => $(id).addEventListener("change", () => applyFilters(id === "t-bars")));
$("btn-reset-filters").addEventListener("click", () => {

/* ---------- Camera ---------- */
function fly(bounds, maxZoom = 16, duration = 1100) {
  const cam = map.cameraForBounds(bounds, { padding: { top: 90, bottom: 110, left: 60, right: 60 + cardW() }, bearing: map.getBearing(), maxZoom });
  // cameraForBounds tính cho bản đồ phẳng; khi nghiêng, phần xa bị thu nhỏ nên phóng thêm một chút cho vừa khung
  if (cam) map.flyTo({ ...cam, zoom: Math.min(maxZoom, cam.zoom + .45), pitch: PITCH, bearing: map.getBearing(), duration: reduced ? 0 : duration, curve: 1.3, essential: true });
}
const boundsOf = (cells) => cells.reduce((b, c) => b.extend([c.b[0][1], c.b[0][0]]).extend([c.b[1][1], c.b[1][0]]), new maplibregl.LngLatBounds());
// Khung nhìn ban đầu như mẫu: phố trung tâm quanh vùng lớn nhất, vài vùng lân cận lấp đầy bản đồ
function home(duration = 1100) {
  if (!ZONES.length) return;
  const [lat, lng] = ZONES[0].anchor, z = innerWidth > 1400 ? 14.85 : 14.55;
  const opts = { center: [lng - .002, lat - .0025], zoom: wide() ? z : 13.9, pitch: PITCH, bearing: BEARING, padding: { right: cardW(), left: 0, top: 0, bottom: 0 } };
  duration ? map.flyTo({ ...opts, duration: reduced ? 0 : duration, essential: true }) : map.jumpTo(opts);
}
$("btn-zin").onclick = () => map.zoomIn({ duration: 350 }); $("btn-zout").onclick = () => map.zoomOut({ duration: 350 });
$("btn-fit").onclick = () => home();
$("btn-north").onclick = () => map.easeTo({ bearing: Math.abs(map.getBearing()) < 1 ? BEARING : 0, pitch: PITCH, duration: 700 });

// Thước tỷ lệ chia 4 vạch như mẫu (0 – 50 – 100 – 150 – 200 m), cập nhật tối đa một lần mỗi khung hình
let scaleReq = 0;
function drawScale() {
  scaleReq = 0;
  const c = map.getCenter(), mpp = 40075016.686 * Math.cos(c.lat * Math.PI / 180) / (512 * 2 ** map.getZoom());
  const nice = [100, 200, 400, 800, 2000, 4000].find((v) => v / mpp >= 110) || 4000, px = Math.round(nice / mpp);
  const unit = nice >= 1000 ? "km" : "m", val = (v) => unit === "km" ? String(v / 1000).replace(".", ",") : v;
  $("scalebar").innerHTML = `<div class="lbls" style="width:${px}px">${[0, 1, 2, 3, 4].map((k) => `<span style="left:${k * 25}%">${val(nice * k / 4)}${k === 4 ? " " + unit : ""}</span>`).join("")}</div>
    <div class="bar" style="width:${px}px">${[1, 2, 3].map((k) => `<i style="left:${k * 25}%"></i>`).join("")}</div>`;
}
map.on("move", () => {
  if (!scaleReq) scaleReq = requestAnimationFrame(drawScale);
  $("compass").style.transform = `rotate(${-map.getBearing()}deg)`;
});

/* ---------- Chọn vùng / quán ---------- */
function clearSelection() {
  if (sel.kind === "zone") setZoneState(sel.z, "sel", false);
  if (sel.kind === "region") { storesInRegion.forEach((s) => map.setFeatureState({ source: "stores", id: s.i }, { in: false })); map.getSource("lasso").setData(empty); storesInRegion = []; }
  if (map.getSource("focus")) map.getSource("focus").setData(empty);
  if (focusPopup) { focusPopup.remove(); focusPopup = null; }
  sel = { kind: "overview" };
}
function selectZone(z, doFly = true) {
  clearSelection(); sel = { kind: "zone", z };
  setZoneState(z, "sel", true); paintMap(); updateLabels(); renderZone(ZONES[z]);
  if (doFly) fly(boundsOf(ZONES[z].cellObjs), 16);
  if (doFly && !wide()) $("map").scrollIntoView({ behavior: "smooth", block: "start" });
}
function overview(doFly = true) {
  clearSelection(); paintMap(); updateLabels(); renderOverview();
  if (doFly) home();
}
function storePopup(s) {

  return `<div class="pn">${esc(s.n)}</div><div class="pm"><span style="color:${cColor(s.k)}">●</span> ${esc(s.sub)}${s.z >= 0 ? " · " + esc(ZONES[s.z].name) : ""}</div>
    <div>${fmtRange(s.pmin, s.pmax)}${s.r != null ? ` · <span class="star">★</span> ${s.r.toFixed(1)} <span class="pm">(${s.rc})</span>` : ""}</div>
    ${c ? `<div class="pq">“${esc(c[1])}”</div>` : ""}`;
}
function openStore(s) {
  if (focusPopup) focusPopup.remove();
  focusPopup = new maplibregl.Popup({ offset: 12, maxWidth: "290px" }).setLngLat([s.ln, s.la]).setHTML(storePopup(s)).addTo(map);
}
function focusStore(s, btn) {
  document.querySelectorAll('.sp[aria-pressed="true"]').forEach((b) => b.setAttribute("aria-pressed", "false"));
  if (btn) btn.setAttribute("aria-pressed", "true");
  if (!catsMap.includes(s.k)) { catsMap = orderedIds(catsMap, s.k, true); renderCatChecks(); applyFilters(false); }
  map.getSource("focus").setData({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [s.ln, s.la] } });
  map.once("moveend", () => openStore(s));
  map.flyTo({ center: [s.ln, s.la], zoom: Math.max(map.getZoom(), 16.8), pitch: PITCH, duration: reduced ? 0 : 1000, essential: true, padding: { right: cardW(), left: 0, top: 0, bottom: 0 } });

}
// Rê chuột: tối đa một lần truy vấn mỗi khung hình, bỏ qua khi bản đồ đang di chuyển
const interactive = (list) => list.filter((l) => map.getLayer(l) && map.getLayoutProperty(l, "visibility") !== "none");
let hoverPt = null, hoverReq = 0;
map.on("mousemove", (e) => {
  if (!D || drawMode) return;
  hoverPt = e.point;
  if (!hoverReq) hoverReq = requestAnimationFrame(() => {
    hoverReq = 0;
    if (map.isMoving()) return;
    const fs = map.queryRenderedFeatures(hoverPt, { layers: interactive(["stores", "zlabels", "bars", "zones-fill"]) });
    const f = fs.find((x) => x.layer.id !== "stores"), z = f ? f.properties.z : null;
    if (hoverZ !== z) { if (hoverZ != null) setZoneState(hoverZ, "hover", false); hoverZ = z; if (z != null) setZoneState(z, "hover", true); }
    map.getCanvas().style.cursor = fs.length ? "pointer" : "";
  });
});
map.on("mouseout", () => { if (hoverZ != null) setZoneState(hoverZ, "hover", false); hoverZ = null; });
map.on("click", (e) => {

/* ---------- Biểu đồ (SVG) ---------- */
// Cột 3D như mẫu: mặt trước đổ dốc màu, mặt trên sáng, mặt bên tối; nhãn % trên đỉnh; tooltip khi rê chuột
function barChart(items) {
  const W = 330, H = 196, top = 30, bottom = 40, n = items.length, dx = 8, dy = 5;
  if (!n) return `<p class="note">Chọn ít nhất một loại hình ở cột “Biểu đồ” trong bộ lọc.</p>`;
  const slot = (W - dx) / n, bw = Math.min(34, slot - 14), base = H - bottom, maxV = Math.max(...items.map((d) => d.value), .0001);
  const defs = items.map((d, i) => `<linearGradient id="bg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(d.color, .18)}"/><stop offset="1" stop-color="${shade(d.color, -.12)}"/></linearGradient>`).join("");
  const bars = items.map((d, i) => {
    const x = i * slot + (slot - bw) / 2, h = Math.max(2, d.value / maxV * (base - top)), y = base - h, lines = d.label.split(" ");
    return `<g data-tip="${esc(`<i style="background:${d.color}"></i>${d.full}: ${d.count} cơ sở (${Math.round(d.value * 100)}%)`)}">
      <rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>
      <ellipse cx="${x + bw / 2 + dx / 2}" cy="${base + 1}" rx="${bw / 2 + 6}" ry="4" fill="#1F3A4D" opacity=".12"/>
      <g class="grow" style="animation-delay:${i * 45}ms">
        <path d="M${x + bw},${y} l${dx},${-dy} V${base - dy} l${-dx},${dy} Z" fill="${shade(d.color, -.28)}"/>
        <rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="url(#bg${i})"/>
        <path d="M${x},${y} l${dx},${-dy} h${bw} l${-dx},${dy} Z" fill="${shade(d.color, .38)}"/>
      </g>
      <text x="${x + bw / 2 + dx / 2}" y="${y - dy - 7}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--card-ink)">${Math.round(d.value * 100)}%</text>
      <line x1="${x + bw / 2}" x2="${x + bw / 2}" y1="${base + 4}" y2="${base + 9}" stroke="var(--card-muted)"/>
      ${lines.map((t, k) => `<text x="${x + bw / 2}" y="${base + 21 + k * 12}" text-anchor="middle" font-size="10.5" fill="var(--card-muted)">${esc(t)}</text>`).join("")}
    </g>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ tỷ lệ loại hình kinh doanh"><defs>${defs}</defs>${bars}</svg><div class="tip" hidden></div></div>`;
}
// Đường: tỷ lệ (%) bình luận theo loại hình, trục y 0–100%, chấm tròn có viền nền, crosshair + tooltip
function lineChart(series, labels) {
  const W = 330, H = 176, L = 36, R = 8, T = 8, B = 24, n = labels.length;
  const X = (i) => L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)), Y = (v) => T + (1 - v / 100) * (H - T - B);
  const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--card-line)"/>
    <text x="${L - 7}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--card-muted)">${v}%</text>`).join("");
  const step = Math.max(1, Math.ceil(n / 7));
  const xl = labels.map((t, i) => (i % step === 0) ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--card-muted)">${t}</text>` : "").join("");
  const lines = series.map((s) => {
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    const dots = n <= 14 ? s.values.map((v, i) => v == null ? "" : `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${s.color}" stroke="var(--card)" stroke-width="1.4"/>`).join("") : "";
    return `<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");
  const data = esc(JSON.stringify({ labels, series: series.map((s) => ({ l: s.label, c: s.color, v: s.values })) }));
  return `<div class="chart line" data-series="${data}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ xu hướng theo thời gian">${grid}${xl}${lines}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--card-muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip" hidden></div></div>`;
}
function bindCharts(root) {
  root.querySelectorAll(".chart").forEach((ch) => {
    const tip = ch.querySelector(".tip"), svg = ch.querySelector("svg");
    const showTip = (html, x, y) => { tip.innerHTML = html; tip.hidden = false; tip.style.left = x + "px"; tip.style.top = y + "px"; };
    if (ch.classList.contains("line")) {
      const { labels, series } = JSON.parse(ch.dataset.series), xh = svg.querySelector(".xh"), hit = svg.querySelector(".hit");
      hit.addEventListener("mousemove", (e) => {
        const r = svg.getBoundingClientRect(), k = 330 / r.width, x = (e.clientX - r.left) * k;
        const L = 36, Rr = 8, n = labels.length, i = Math.max(0, Math.min(n - 1, Math.round((x - L) / ((330 - L - Rr) / Math.max(1, n - 1)))));
        const px = L + (n === 1 ? 0 : i * (330 - L - Rr) / (n - 1));
        xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
        const rows = series.filter((s) => s.v[i] != null).sort((a, b) => b.v[i] - a.v[i]).map((s) => `<i style="background:${s.c}"></i>${esc(s.l)}: ${Math.round(s.v[i])}%`).join("<br>");
        showTip(`<b>${labels[i]}</b><br>${rows || "Không có bình luận"}`, px / k, 6);
      });
      hit.addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
    } else {
      ch.querySelectorAll("[data-tip]").forEach((g) => {
        g.addEventListener("mouseenter", () => { const r = g.getBoundingClientRect(), cr = ch.getBoundingClientRect(); showTip(g.dataset.tip, r.left - cr.left + r.width / 2, 12); });
        g.addEventListener("mouseleave", () => { tip.hidden = true; });
      });
    }
  });
}
// Xu hướng: gộp số bình luận theo ngày thành các mốc, tính tỷ lệ % giữa các loại hình đang bật
function trendSeries(trends, range) {
  const days = D.meta.trend_days || 90, size = range === 7 ? 1 : range === 30 ? 5 : 7, nb = Math.floor(Math.min(range, days) / size);
  const end = new Date(D.meta.trend_end + "T00:00:00"), labels = [], cs = catsChart;
  const sums = cs.map(() => new Array(nb).fill(0));
  for (let b = 0; b < nb; b++) {
    const from = days - (nb - b) * size;
    cs.forEach((c, ci) => trends.forEach((t) => { for (let d = from; d < from + size; d++) sums[ci][b] += (t && t[c] ? t[c][d] : 0) || 0; }));
    const dt = new Date(end); dt.setDate(end.getDate() - (nb - 1 - b) * size);
    labels.push(`${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}`);
  }
  const totals = labels.map((_, b) => sums.reduce((a, s) => a + s[b], 0));
  const series = cs.map((c, ci) => ({ label: cShort(c), color: cColor(c), values: sums[ci].map((v, b) => totals[b] ? v / totals[b] * 100 : null) }));
  return { series, labels, n: totals.reduce((a, b) => a + b, 0) };
}

const rating = (r) => r == null ? "–" : `<span class="star">★</span> ${r.toFixed(2).replace(".", ",")}`;

const isSim = () => D && [D.meta.source.prices, D.meta.source.reviews].includes("sim");
function composition(counts, total) {
  const cs = CATS.filter((c) => catsChart.includes(c.id));
  const items = cs.map((c) => ({ label: cShort(c.id), full: c.label, value: total ? (counts[c.id] || 0) / total : 0, count: counts[c.id] || 0, color: cColor(c.id) }));
  const rows = cs.map((c) => `<li><span class="dot" style="background:${cColor(c.id)}"></span><span>${esc(c.label)}</span>
    <span class="v">${fmtN(counts[c.id] || 0)}<small>(${total ? Math.round((counts[c.id] || 0) / total * 100) : 0}%)</small></span></li>`).join("");
  return `<section class="sec"><h3>Tỷ lệ loại hình kinh doanh</h3>${barChart(items)}</section>
    <section class="sec"><h3>Chi tiết theo số lượng cơ sở</h3><ul class="rows">${rows}</ul>`;
}
function trendSection(trends) {
  if (!D.meta.trend_end) return "";
  const { series, labels, n } = trendSeries(trends, trendRange), idx = [7, 30, 90].indexOf(trendRange);
  return `<section class="sec"><h3>Xu hướng theo thời gian <small>${fmtN(n)} bình luận${isSim() ? '<span class="tagline">giả lập</span>' : ""}</small></h3>
    <div class="tabs" role="tablist"><span class="thumb" style="transform:translateX(${idx * 100}%)"></span>${[7, 30, 90].map((r) => `<button type="button" role="tab" data-range="${r}" aria-selected="${r === trendRange}">${r} ngày</button>`).join("")}</div>
    ${lineChart(series, labels)}
    <div class="leg">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>
    ${n < 30 ? `<p class="note" style="margin-top:10px">Ít bình luận trong khoảng này nên tỷ lệ dao động mạnh.</p>` : ""}</section>`;
}
let topList = [];
function topSection(S) {
  topList = S.filter((s) => catsChart.includes(s.k)).sort((a, b) => ((b.r || 0) * Math.log1p(b.rc)) - ((a.r || 0) * Math.log1p(a.rc))).slice(0, 5);
  if (!topList.length) return "";
  return `<section class="sec"><h3>Cơ sở nổi bật</h3><ul class="top">${topList.map((s, i) => `<li><button type="button" class="sp" data-k="${i}" aria-pressed="false" title="Xem trên bản đồ">
    <span><span style="color:${cColor(s.k)}">●</span> ${esc(s.n)}</span><span class="p">${s.r != null ? `<span class="star">★</span> ${s.r.toFixed(1)} · ` : ""}${fmtK(s.pmin != null ? (s.pmin + s.pmax) / 2 : null)}</span></button></li>`).join("")}</ul></section>`;
}
const kwSection = (kw) => kw && kw.length ? `<section class="sec"><h3>Từ khoá bình luận</h3><div class="chips">${kw.map((k) => `<span class="kw">${esc(k)}</span>`).join("")}</div></section>` : "";
const priceSection = (price, rate) => `<section class="sec"><h3>Giá &amp; đánh giá ${isSim() ? '<small><span class="tagline">giả lập</span></small>' : ""}</h3><div class="boxes" style="margin-top:0">${box("price", "Giá TB mỗi người", fmtK(price))}${box("star", "Đánh giá TB", rating(rate))}</div></section>`;
function setDetail(html, keepScroll) {
  const el = $("detail"), y = el.scrollTop;
  el.innerHTML = `<div class="${keepScroll ? "" : "in"}">${html}</div>`;
  el.scrollTop = keepScroll ? y : 0;
}
function finish(onClose) {
  const el = $("detail");
  if ($("btn-close")) $("btn-close").onclick = onClose;
  el.querySelectorAll(".sp").forEach((b) => b.onclick = () => focusStore(topList[+b.dataset.k], b));
  el.querySelectorAll("[data-range]").forEach((b) => b.onclick = () => { trendRange = +b.dataset.range; rerender(true); });
  el.querySelectorAll("[data-zone]").forEach((b) => b.onclick = () => selectZone(+b.dataset.zone));
  bindCharts(el);
}
const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
const avgPrice = (S) => avg(S.filter((s) => s.pmin != null).map((s) => (s.pmin + s.pmax) / 2));
const avgRating = (S) => avg(S.filter((s) => s.r != null).map((s) => s.r));

function renderZone(Z, keep) {
  const T = TYPES[Z.t];
  setDetail(head("Chi tiết vùng", "Đóng chi tiết vùng") + `
    <div class="zrow"><span class="dot" style="background:${tColor(Z.t)}"></span><b>${esc(Z.name)} (${fmtKm2(Z.km2)})</b><span class="pill">Đang chọn</span></div>
    <p class="zsub">${esc(T.name)}</p>
    ${composition(Z.cats, Z.total)}
    <div class="boxes">${box("store", "Tổng số cơ sở", fmtN(Z.n))}${box("area", "Diện tích vùng", fmtKm2(Z.km2))}</div></section>
    ${trendSection([Z.trend])}
    <section class="sec"><h3>Kiểu khu vực</h3><ul class="rows"><li><span class="dot" style="background:${tColor(Z.t)}"></span><span>${esc(T.name)}<br><small class="note">${esc(T.desc)}</small></span><span></span></li></ul></section>
    ${priceSection(Z.price, Z.rating)}
    ${kwSection(Z.kw)}${topSection(Z.stores)}`, keep);
  finish(() => overview());
}
function renderOverview(keep) {
  const m = D.meta, counts = {}, S = ZONES.flatMap((z) => z.stores);
  ZONES.forEach((z) => Object.entries(z.cats).forEach(([c, v]) => counts[c] = (counts[c] || 0) + v));
  const total = Object.values(counts).reduce((a, b) => a + b, 0), label = (v) => v === "sim" ? "giả lập" : v === "crawl" ? "crawl" : v;
  setDetail(head("Tổng quan") + `
    <div class="zrow"><span class="dot" style="background:var(--accent)"></span><b>Toàn khu vực (${fmtKm2(ZONES.reduce((a, z) => a + z.km2, 0))})</b><span class="pill">${ZONES.length} vùng</span></div>
    <p class="zsub">Chọn một vùng trên bản đồ để xem chi tiết</p>
    ${composition(counts, total)}
    <div class="boxes">${box("store", "Tổng số cơ sở", fmtN(total))}${box("area", "Số vùng phân tích", ZONES.length)}</div></section>
    <section class="sec"><h3>Kiểu khu vực <small>${m.method} · k = ${m.k}</small></h3><ul class="rows">${TYPES.map((t) => {
      const zs = ZONES.filter((z) => z.t === t.id); if (!zs.length) return "";
      return `<li class="link" data-zone="${zs[0].id}" title="Xem vùng lớn nhất của kiểu này"><span class="dot" style="background:${tColor(t.id)}"></span><span>${esc(t.name)}</span><span class="v">${zs.length}<small>vùng</small></span></li>`;
    }).join("")}</ul></section>
    ${trendSection(ZONES.map((z) => z.trend))}
    ${priceSection(avgPrice(S), avgRating(S))}
    <section class="sec"><h3>Mô hình <small>giá: ${label(m.source.prices)} · bình luận: ${label(m.source.reviews)}</small></h3>
      <div class="metrics"><div><b>${m.metrics.silhouette.toFixed(2)}</b><span>Silhouette</span></div><div><b>${m.metrics.davies_bouldin.toFixed(2)}</b><span>Davies–Bouldin</span></div>
      <div><b>${m.metrics.stability.toFixed(2)}</b><span>Độ ổn định</span></div><div><b>${m.metrics.ari_hc.toFixed(2)} / ${m.metrics.ari_gmm.toFixed(2)}</b><span>Khớp HC / GMM</span></div></div></section>`, keep);
  finish();
}
function renderRegion(keep) {
  const S = storesInRegion, counts = {}, byZ = {};
  S.forEach((s) => { counts[s.k] = (counts[s.k] || 0) + 1; byZ[s.z] = (byZ[s.z] || 0) + 1; });
  const zs = ZONES.filter((z) => byZ[z.id]).sort((a, b) => byZ[b.id] - byZ[a.id]);
  setDetail(head("Vùng đã khoanh", "Bỏ vùng đã khoanh") + `
    <div class="zrow"><span class="dot" style="background:var(--accent)"></span><b>${fmtN(S.length)} cơ sở (${fmtKm2(sel.km2)})</b><span class="pill">Đang chọn</span></div>
    ${S.length ? `${composition(counts, S.length)}
    <div class="boxes">${box("store", "Tổng số cơ sở", fmtN(S.length))}${box("area", "Diện tích", fmtKm2(sel.km2))}</div></section>
    <section class="sec"><h3>Theo vùng</h3><ul class="rows">${zs.map((z) => `<li class="link" data-zone="${z.id}"><span class="dot" style="background:${tColor(z.t)}"></span><span>${esc(z.name)} · ${esc(TYPES[z.t].name)}</span><span class="v">${byZ[z.id]}</span></li>`).join("")}
      ${byZ[-1] ? `<li><span class="dot" style="background:#94A3B8"></span><span>Ngoài vùng phân tích</span><span class="v">${byZ[-1]}</span></li>` : ""}</ul></section>
    ${priceSection(avgPrice(S), avgRating(S))}
    ${topSection(S)}` : `<p class="note" style="margin-top:12px">Không có cơ sở nào. Thử khoanh rộng hơn.</p>`}`, keep);
  finish(() => overview(false));
}
function renderEmpty(msg) {
  setDetail(head("Chưa có dữ liệu") + `<p class="note" style="margin-bottom:16px">${esc(msg)}</p>
    <button class="btn-primary" id="btn-load2" type="button">Chọn file areas.json</button>`);
  $("btn-load2").onclick = () => $("file-input").click();
}
function rerender(keep = true) {
  if (!D) return;
  if (sel.kind === "zone") renderZone(ZONES[sel.z], keep); else if (sel.kind === "region") renderRegion(keep); else renderOverview(keep);
}

/* ---------- Khoanh vùng tự do ---------- */
const drawLayer = $("draw-layer"), drawLine = $("draw-line"), btnDraw = $("btn-draw");
let drawMode = false, pts = null;
function setDrawMode(on) { drawMode = on; drawLayer.hidden = !on; pts = null; drawLine.setAttribute("points", ""); btnDraw.setAttribute("aria-pressed", on); }
function inPoly(lng, lat, poly) { return inRing(lng, lat, poly); }
function areaKm2(poly) {
  const kx = mPerLng(poly.reduce((a, p) => a + p[1], 0) / poly.length) / 1000, ky = M_PER_LAT / 1000;
  return Math.abs(signedArea(poly.map(([x, y]) => [x * kx, y * ky])));
}
const localPt = (e) => { const r = drawLayer.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
drawLayer.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault(); drawLayer.setPointerCapture(e.pointerId); pts = [localPt(e)]; drawLine.setAttribute("stroke", "#2E6E92");
});
drawLayer.addEventListener("pointermove", (e) => {
  if (!pts) return;
  const p = localPt(e), q = pts[pts.length - 1];
  if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 4) return;
  pts.push(p); drawLine.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
});
drawLayer.addEventListener("pointerup", () => {
  if (!pts) return;
  const sp = pts; pts = null; drawLine.setAttribute("points", "");
  if (sp.length < 3 || !D) return; // chỉ nhấp/chạm: chưa thành vùng, giữ chế độ vẽ
  const poly = sp.map((p) => { const ll = map.unproject(p); return [ll.lng, ll.lat]; });
  setDrawMode(false); clearSelection();
  storesInRegion = STORES.filter((s) => catsMap.includes(s.k) && inPoly(s.ln, s.la, poly));
  sel = { kind: "region", km2: areaKm2(poly) };
  storesInRegion.forEach((s) => map.setFeatureState({ source: "stores", id: s.i }, { in: true }));
  map.getSource("lasso").setData({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [[...poly, poly[0]]] } });
  paintMap(); updateLabels(); renderRegion();
});
drawLayer.addEventListener("pointercancel", () => { pts = null; drawLine.setAttribute("points", ""); });
drawLayer.addEventListener("wheel", (e) => { e.preventDefault(); map.getCanvas().dispatchEvent(new WheelEvent("wheel", e)); }, { passive: false });
btnDraw.onclick = () => setDrawMode(!drawMode);

/* ---------- Tìm kiếm ---------- */
const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
let results = [], active = -1;
function search(q) {
  const toks = norm(q).trim().split(/\s+/).filter(Boolean);
  if (!toks.length || !D) return [];
  const hit = (s) => { const n = norm(s); return toks.every((t) => n.includes(t)); };
  const out = [];
  ZONES.forEach((z) => { if (hit(`${z.name} vung ${z.id + 1} ${TYPES[z.t].name}`)) out.push({ kind: "Vùng", label: z.name, sub: TYPES[z.t].name, color: tColor(z.t), go: () => selectZone(z.id) }); });
  TYPES.forEach((t) => { if (hit(t.name)) { const z = ZONES.find((x) => x.t === t.id); if (z) out.push({ kind: "Kiểu khu vực", label: t.name, color: tColor(t.id), go: () => selectZone(z.id) }); } });
  PLACES().forEach((w) => { if (hit(`phuong ${w.name}`)) out.push({ kind: "Địa điểm", label: `Phường ${w.name}`, color: "#8A96A8", go: () => { $("f-place").value = w.name; $("f-place").dispatchEvent(new Event("change")); } }); });
  LANDMARKS.forEach(([n, lng, lat]) => { if (hit(n)) out.push({ kind: "Địa điểm", label: n, color: INK, go: () => map.flyTo({ center: [lng, lat], zoom: 16.4, pitch: PITCH, duration: reduced ? 0 : 1100, essential: true, padding: { right: cardW(), left: 0, top: 0, bottom: 0 } }) }); });
  CATS.forEach((c) => { if (hit(`${c.label} ${c.detail}`)) out.push({ kind: "Loại hình", label: c.label, sub: c.detail, color: cColor(c.id), go: () => { catsMap = [c.id]; catsChart = [c.id]; renderCatChecks(); applyFilters(); } }); });
  let ns = 0;
  for (const s of STORES) { if (ns >= 6) break; if (hit(s.n)) { ns++; out.push({ kind: "Cơ sở", label: s.n, sub: `${s.sub}${s.z >= 0 ? " · " + ZONES[s.z].name : ""}`, color: cColor(s.k), go: () => focusStore(s) }); } }
  return out.slice(0, 10);
}
function showResults() {
  const list = $("results");
  list.hidden = !$("q").value.trim(); $("q").setAttribute("aria-expanded", !list.hidden);
  list.innerHTML = results.length ? results.map((r, i) => `<li><button type="button" role="option" data-i="${i}" aria-selected="${i === active}">
    <span class="dot" style="background:${r.color}"></span><span>${esc(r.label)}${r.sub ? `<span class="sub">${esc(r.sub)}</span>` : ""}</span><span class="kind">${r.kind}</span></button></li>`).join("")
    : `<li class="none">Không tìm thấy kết quả</li>`;
}
function choose(i) { const r = results[i]; if (!r) return; $("q").value = ""; $("results").hidden = true; $("q").blur(); r.go(); }
$("q").addEventListener("input", () => { results = search($("q").value); active = -1; showResults(); });
$("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + results.length) % Math.max(1, results.length); showResults(); }
  else if (e.key === "Enter") choose(active >= 0 ? active : 0);
  else if (e.key === "Escape") { $("q").value = ""; $("results").hidden = true; }
});
$("results").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) choose(+b.dataset.i); });

/* ---------- Thông báo, menu tài khoản ---------- */
const fmtTime = (iso) => { const [d, t = ""] = String(iso || "").split("T"), [y, mo, da] = d.split("-"); return `${da}/${mo}/${y}${t ? " lúc " + t.slice(0, 5) : ""}`; };
function renderNotes() {
  const m = D.meta, notes = [];
  if (isSim()) notes.push(["warn", "Giá và bình luận đang là dữ liệu giả lập", "Đặt file crawl vào data/crawl/ rồi chạy lại notebook để thay bằng dữ liệu thật."]);
  notes.push(["", `Đã cập nhật dữ liệu ${fmtTime(m.generated_at)}`, `${fmtN(m.n_stores)} cơ sở · ${m.n_cells} ô ${m.cell_m} m · ${m.n_zones} vùng`]);
  notes.push(["", `Mô hình ${m.method} chia ${m.k} kiểu khu vực`, `Silhouette ${m.metrics.silhouette.toFixed(2)} · ổn định ${m.metrics.stability.toFixed(2)} · khớp HC/GMM ${m.metrics.ari_hc.toFixed(2)}/${m.metrics.ari_gmm.toFixed(2)}`]);
  $("notes").innerHTML = notes.map(([c, t, s]) => `<li><i class="${c}"></i><span>${esc(t)}<small>${esc(s)}</small></span></li>`).join("");
  $("bell-badge").hidden = store.get("hch-seen", "") === m.generated_at;
}
const menus = { bell: [$("btn-bell"), $("menu-bell")], user: [$("btn-user"), $("menu-user")] };
function toggleMenu(name, force) {
  Object.entries(menus).forEach(([k, [btn, el]]) => {
    const open = k === name ? (force ?? el.hidden) : false;
    el.hidden = !open; btn.setAttribute("aria-expanded", open);
  });
  if (name === "bell" && !$("menu-bell").hidden && D) { store.set("hch-seen", D.meta.generated_at); $("bell-badge").hidden = true; }
}
$("btn-bell").onclick = (e) => { e.stopPropagation(); toggleMenu("bell"); };
$("btn-user").onclick = (e) => { e.stopPropagation(); toggleMenu("user"); };
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) $("results").hidden = true;
  if (!e.target.closest(".menu")) toggleMenu(null);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (drawMode) setDrawMode(false); toggleMenu(null); } });
const themeState = () => { $("mi-theme-state").textContent = document.documentElement.dataset.theme === "dark" ? "Tối" : "Sáng"; };
$("mi-theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("hch-theme", next); themeState();
};
$("mi-base").onclick = () => { basemap = basemap === "sat" ? "map" : "sat"; store.set("hch-basemap", basemap); applyBasemap(); paintMap(); drawLabels(); };
$("mi-load").onclick = () => { toggleMenu(null); $("file-input").click(); };
themeState();
$("file-input").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { const data = JSON.parse(await f.text()); await mapReady; load(data); toast(`Đã nạp ${f.name}`); }
  catch (err) { toast("Không đọc được file: " + err.message); }
});
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.querySelector(".map-wrap").appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------- Khởi động ---------- */
(async () => {
  try {
    const [r] = await Promise.all([fetch(DATA_URL, { cache: "no-store" }), mapReady]);
    if (!r.ok) throw new Error(r.status);
    load(await r.json());
  } catch (err) {
    await mapReady; drawLabels();
    renderEmpty(location.protocol === "file:"
      ? "Trình duyệt chặn đọc file khi mở trực tiếp. Mở trang qua Live Server/Vercel, hoặc chọn file data/web/areas.json."
      : `Không tải được ${DATA_URL} (${err.message}). Chạy notebook để tạo file, hoặc chọn file thủ công.`);
  }
  drawScale();
  // Ẩn màn tải khi bản đồ đã vẽ xong lần đầu (tối đa 6 giây nếu mạng chậm)
  const done = () => $("loading").classList.add("done");
  map.once("idle", done); setTimeout(done, 6000);
})();
</script>
</body>
</html>
