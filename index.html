<style>/* required styles */

.leaflet-pane,

:root{
  --surface:#11171D; --panel:#172029; --chip:#1F2A35; --line:#2A3743;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:400 14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:380px 1fr;height:100%}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);z-index:2}

/* Logo: bản tối mặc định, bản sáng khi ở chế độ sáng */
.brandmark{display:block;height:28px;margin-bottom:18px}
.brandmark svg{display:block;height:28px;width:auto}
.logo-light{display:none!important}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .logo-dark{display:none!important} :root:not([data-theme="dark"]) .logo-light{display:block!important} }
:root[data-theme="light"] .logo-dark{display:none!important}
:root[data-theme="light"] .logo-light{display:block!important}

.head{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.lbl::before{content:"// ";color:var(--brand-ink)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{flex:none;font:500 10px/1 var(--font-num);letter-spacing:.08em;text-transform:uppercase;color:var(--heat-ink);background:var(--heat-soft);padding:4px 7px;border-radius:var(--r-pill);cursor:help}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden}
.kpi{padding:9px 12px}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi b{display:block;font:500 18px/1.2 var(--font-num);font-variant-numeric:tabular-nums}
.kpi span{font:400 10px/1.4 var(--font-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.lbl{font:500 10.5px/1.4 var(--font-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.topics{padding:16px 22px 12px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:500 12px/1 var(--font-ui);border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 12px;border-radius:var(--r-chip);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.filters button:hover{background:var(--chip);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand)}
button:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}

.scroll{overflow:auto;flex:1;min-height:0;padding:4px 12px 16px;scrollbar-color:var(--line) transparent}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.cl{display:grid;grid-template-columns:3px 1fr auto;gap:12px;align-items:stretch;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-btn);padding:10px 12px 10px 10px;cursor:pointer;color:inherit;font:inherit;transition:background .15s}
.cl:hover{background:var(--chip)}
.cl[aria-selected="true"]{background:var(--brand-soft)}
.cl .stripe{border-radius:2px}
.cl .t{font-weight:500;font-size:14px;line-height:1.3}
.cl .m{font:400 11.5px var(--font-num);font-variant-numeric:tabular-nums;color:var(--muted);margin-top:3px}
.cl .n{font:500 14px var(--font-num);font-variant-numeric:tabular-nums;text-align:right;align-self:center;color:var(--muted)}
.cl[aria-selected="true"] .n{color:var(--ink)}

main{position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--m-road)}
.card{position:absolute;z-index:600;top:16px;right:16px;width:340px;max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.card .top-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .grp{display:flex;gap:7px;align-items:center;font:500 10.5px var(--font-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.card h2{font-size:17px;font-weight:600;line-height:1.3;margin:6px 0 6px;text-wrap:balance}
.card .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.x{border:0;background:var(--chip);color:var(--muted);width:28px;height:28px;border-radius:var(--r-btn);cursor:pointer;font-size:16px;line-height:1;flex:none}
.x:hover{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden;margin-bottom:18px}
.stat{background:var(--panel);padding:9px 11px}
.stat b{display:block;font:500 16px var(--font-num);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.bars{display:grid;gap:7px;margin-bottom:18px}
.bar{display:grid;grid-template-columns:108px 1fr 38px;gap:8px;align-items:center;font-size:12px}
.track{height:6px;background:var(--chip);border-radius:var(--r-chip);overflow:hidden}
.fill{display:block;height:100%;border-radius:var(--r-chip)}
.bar .v{font:500 11.5px var(--font-num);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.top{list-style:none;margin:0;padding:0}
.top li{border-top:1px solid var(--line)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;width:calc(100% + 16px);margin:2px -8px;padding:6px 8px;text-align:left;background:none;border:0;border-radius:var(--r-btn);color:inherit;font:inherit;font-size:12.5px;cursor:pointer;transition:background .15s}
.sp:hover{background:var(--chip)}
.sp[aria-pressed="true"]{background:var(--brand-soft);font-weight:500}
.top .p{font:500 11.5px var(--font-num);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.star{color:var(--star)}
.tools{position:absolute;z-index:600;left:16px;bottom:16px;display:flex;gap:6px}
.btn{font:500 12.5px/1 var(--font-ui);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-btn);padding:10px 14px;box-shadow:var(--shadow-sm);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--chip)}
.btn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}

/* Leaflet theming */
.leaflet-container{font-family:var(--font-ui);background:var(--m-road)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content-wrapper{border-radius:var(--r-card)}
.leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.55}
.leaflet-popup-content .pn{font-weight:600;font-size:13.5px}
.leaflet-popup-content .pm{color:var(--muted)}
.leaflet-popup-content .pc{display:flex;gap:6px;align-items:center;margin-top:4px;font-weight:500}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow-sm)!important;border-radius:var(--r-btn)!important;overflow:hidden}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line);font-family:var(--font-num)!important;font-weight:400!important}
.leaflet-bar a:hover{background:var(--chip)}
.leaflet-bar a.leaflet-disabled{background:var(--panel);color:var(--muted)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font:400 10px var(--font-num);border-top-left-radius:var(--r-pill)}
.leaflet-control-attribution a{color:var(--brand-ink)!important}
.leaflet-tooltip.place{background:none;border:0;box-shadow:none;color:var(--m-label-ink);font:500 10px var(--font-num);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 2px var(--m-land),0 0 2px var(--m-land)}
.leaflet-tooltip.place.water{font:300 italic 12px var(--font-ui);letter-spacing:.06em;text-transform:none;color:var(--m-water-ink);text-shadow:none}
.leaflet-tooltip.place::before,.leaflet-tooltip.cl-label::before{display:none}
.leaflet-tooltip.cl-label{background:var(--ink);color:var(--panel);border:0;border-radius:var(--r-pill);padding:5px 9px;font:500 11.5px var(--font-num);box-shadow:var(--shadow-sm)}

/* Khoanh vùng: lớp phủ nhận nét vẽ, nằm trên bản đồ nhưng dưới nút zoom, thẻ chi tiết và thanh công cụ */
.draw-layer{position:absolute;inset:0;z-index:500;cursor:crosshair;touch-action:none;outline:2px dashed var(--brand);outline-offset:-2px}
.draw-layer[hidden]{display:none}
.draw-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);font:500 12px var(--font-ui);padding:7px 12px;border-radius:var(--r-chip);box-shadow:var(--shadow-sm);pointer-events:none;white-space:nowrap}
.rc-list{display:grid;gap:2px;margin-bottom:18px}
.rc{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:var(--r-btn);padding:7px 8px;margin:0 -8px;color:inherit;font:inherit;font-size:12.5px}
button.rc{cursor:pointer}
button.rc:hover{background:var(--chip)}
.rc-v{font:500 11.5px var(--font-num);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.sw-noise{background:var(--m-noise)}

.ov{display:grid;gap:6px}
.ov-row{display:grid;gap:3px;text-align:left;background:var(--chip);border:1px solid transparent;border-radius:var(--r-btn);padding:10px 12px;cursor:pointer;color:inherit;font:inherit;transition:background .15s}
.ov-row:hover{background:var(--brand-soft);border-color:var(--brand)}
.ov-row .lbl{margin:0}
.ov-row .lbl::before{content:none}
.ov-name{font-weight:500;font-size:13.5px;display:flex;gap:8px;align-items:center}
.ov-v{font:500 12px var(--font-num);font-variant-numeric:tabular-nums;color:var(--muted);padding-left:16px}
@media (max-width:860px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  aside{display:contents}
  .head{order:0;background:var(--panel)} main{order:1;height:auto;display:flex;flex-direction:column} .topics{order:2} .scroll{order:3}
  #map{position:relative;height:56vh;min-height:340px}
  .card{position:static;width:auto;max-height:none;margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));box-shadow:none}
  /* neo vào đáy bản đồ (main còn chứa thẻ chi tiết bên dưới) */
  .tools{left:max(12px,env(safe-area-inset-left,0px));bottom:auto;top:calc(max(56vh,340px) - 64px)}
  .btn{padding:10px 11px}
  .draw-layer{inset:auto;top:0;left:0;right:0;height:max(56vh,340px)}
  .head{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topics{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .scroll{overflow:visible;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      <div class="stat"><b><span class="star">★</span> ${C.avgRating.toFixed(2)}</b><span>đánh giá</span></div>
      <div class="stat"><b>${Math.round(C.density)}</b><span>quán/km²</span></div>
    </div>
    <p class="lbl">Loại món</p>
    <div class="bars">${C.cats.slice(0, 3).map(([k, v]) => `<div class="bar"><span>${CAT[k]}</span><span class="track"><span class="fill" style="width:${v / max * 100}%;background:${C.color}"></span></span><span class="v">${Math.round(v / C.stores.length * 100)}%</span></div>`).join("")}</div>
    <p class="lbl">Quán nổi bật</p>
    <ul class="top">${top.map(topItem).join("")}</ul>`;
  document.getElementById("btn-close").onclick = overview;
  bindTop(el);
}

/* ---------- Khoanh vùng tự do: vẽ trên bản đồ, thống kê các quán nằm trong vùng ---------- */
const lassoRenderer = L.svg({ padding: .2 });
const drawLayer = document.getElementById("draw-layer"), btnDraw = document.getElementById("btn-draw");
let drawMode = false, lassoLine = null, pts = null, lastPt = null;

/* ---------- Làm nổi bật một quán khi bấm tên trong "Quán nổi bật" ---------- */
let focusRing = null;
const topItem = s => `<li><button type="button" class="sp" data-i="${stores.indexOf(s)}" aria-pressed="false" title="Xem quán trên bản đồ"><span>${s.n}</span><span class="p"><span class="star">★</span> ${s.r.toFixed(1)} · ${fmtK(s.p)}</span></button></li>`;
function bindTop(el) { el.querySelectorAll(".sp").forEach(b => b.onclick = () => focusStore(+b.dataset.i, b)); }
function clearFocus() { if (focusRing) { map.removeLayer(focusRing); focusRing = null; } }
function focusStore(i, btn) {
  clearFocus();
  document.querySelectorAll('.sp[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  const m = markers[i], ll = m.getLatLng(), wide = innerWidth > 860;
  focusRing = L.circleMarker(ll, { renderer: lassoRenderer, interactive: false, radius: 11, weight: 2.5, color: css("--ink"), fill: false }).addTo(map);
  m.bringToFront();
  // Chỉ bay tới khi quán đang khuất (bị thẻ chi tiết che, ra ngoài khung nhìn, hoặc zoom quá xa)
  const p = map.latLngToContainerPoint(ll), sz = map.getSize(), right = wide ? 400 : 40;
  const visible = map.getZoom() >= 15.5 && p.x > 60 && p.x < sz.x - right && p.y > 70 && p.y < sz.y - 70;
  if (visible) m.openPopup();
  else {
    map.once("moveend", () => m.openPopup());
    map.flyToBounds(L.latLngBounds([ll, ll]), { paddingTopLeft: [60, 70], paddingBottomRight: [right, 70], maxZoom: Math.max(map.getZoom(), 16.5), duration: .6 });
  }
  if (!wide) document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "start" });
}

// Điểm trong đa giác (ray casting); poly là mảng [lat, lng]
function inPoly(la, ln, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ya, xa] = poly[i], [yb, xb] = poly[j];
    if ((ya > la) !== (yb > la) && ln < (xb - xa) * (la - ya) / (yb - ya) + xa) inside = !inside;
  }
  return inside;
}
// Diện tích xấp xỉ (km²): chiếu phẳng quanh vĩ độ trung bình, công thức shoelace
function areaKm2(poly) {
  const kx = 111.32 * Math.cos(poly.reduce((a, p) => a + p[0], 0) / poly.length * Math.PI / 180), ky = 110.574;
  let a = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) a += poly[j][1] * kx * poly[i][0] * ky - poly[i][1] * kx * poly[j][0] * ky;
  return Math.abs(a) / 2;
}
function setDrawMode(on) {
  drawMode = on; drawLayer.hidden = !on;
  btnDraw.setAttribute("aria-pressed", on); btnDraw.textContent = on ? "Huỷ khoanh" : "Khoanh vùng";
  if (!on && lassoLine) { map.removeLayer(lassoLine); lassoLine = null; pts = null; }
}
function clearRegion() {
  clearFocus(); map.closePopup();
  if (lassoShape) { map.removeLayer(lassoShape); lassoShape = null; }
  region = null;
}
function closeRegion() { clearRegion(); restyle(); renderDetail(null); }
function setRegion(ll) {
  clearRegion(); selected = null; if (label) { map.removeLayer(label); label = null; }
  const poly = ll.map(p => [p.lat, p.lng]);
  const S = stores.filter(s => inPoly(s.la, s.ln, poly));
  region = { stores: S, set: new Set(S), km2: areaKm2(poly) };
  lassoShape = L.polygon(ll, { renderer: lassoRenderer, interactive: false, weight: 2, fillOpacity: .1 }).addTo(map);
  restyle(); renderList(); renderRegion();
}
function renderRegion() {
  const el = document.getElementById("detail"), S = region.stores, n = S.length, km2 = region.km2;
  let body;
  if (!n) body = `<p class="desc">Không có quán nào. Thử khoanh rộng hơn.</p>`;
  else {
    const avgP = S.reduce((a, s) => a + s.p, 0) / n, avgR = S.reduce((a, s) => a + s.r, 0) / n;
    const byC = {}, cat = {};
    S.forEach(s => { byC[s.c || ""] = (byC[s.c || ""] || 0) + 1; cat[s.k] = (cat[s.k] || 0) + 1; });
    const cats = Object.entries(cat).sort((a, b) => b[1] - a[1]), max = cats[0][1];
    const cls = CL.filter(C => byC[C.id]).sort((a, b) => byC[b.id] - byC[a.id]);
    const top = S.slice().sort((a, b) => b.r - a.r || a.p - b.p).slice(0, 5);
    body = `<div class="stats">
      <div class="stat"><b>${fmtK(avgP)}</b><span>giá TB</span></div>
      <div class="stat"><b><span class="star">★</span> ${avgR.toFixed(2)}</b><span>đánh giá</span></div>
      <div class="stat"><b>${km2.toFixed(2)}</b><span>km²</span></div>
      <div class="stat"><b>${km2 > 0 ? Math.round(n / km2) : "–"}</b><span>quán/km²</span></div>
    </div>
    <p class="lbl">Theo cụm</p>
    <div class="rc-list">${cls.map(C => `<button type="button" class="rc" data-id="${C.id}" title="${byC[C.id]} trên ${C.stores.length} quán của cụm"><span class="sw" style="background:${C.color}"></span><span>${C.name}</span><span class="rc-v">${byC[C.id]}/${C.stores.length}</span></button>`).join("")}${byC[""] ? `<div class="rc"><span class="sw sw-noise"></span><span>Quán lẻ</span><span class="rc-v">${byC[""]}</span></div>` : ""}</div>
    <p class="lbl">Loại món</p>
    <div class="bars">${cats.slice(0, 3).map(([k, v]) => `<div class="bar"><span>${CAT[k]}</span><span class="track"><span class="fill" style="width:${v / max * 100}%;background:var(--brand)"></span></span><span class="v">${Math.round(v / n * 100)}%</span></div>`).join("")}</div>
    <p class="lbl">Quán nổi bật</p>
    <ul class="top">${top.map(topItem).join("")}</ul>`;
  }
  el.innerHTML = `<div class="top-row"><div><p class="lbl">Vùng đã khoanh</p><h2><span class="num">${n}</span> quán</h2></div>
      <button class="x" id="btn-close" type="button" aria-label="Bỏ vùng đã khoanh">×</button></div>` + body;
  document.getElementById("btn-close").onclick = closeRegion;
  el.querySelectorAll("button.rc").forEach(b => b.onclick = () => select(b.dataset.id));
  bindTop(el);
  if (innerWidth <= 860) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

const toLatLng = e => { const r = map.getContainer().getBoundingClientRect(); return map.containerPointToLatLng([e.clientX - r.left, e.clientY - r.top]); };
drawLayer.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  e.preventDefault(); drawLayer.setPointerCapture(e.pointerId);
  pts = [toLatLng(e)]; lastPt = [e.clientX, e.clientY];
  lassoLine = L.polyline(pts, { renderer: lassoRenderer, interactive: false, color: css("--brand"), weight: 2, dashArray: "4 4" }).addTo(map);
});
drawLayer.addEventListener("pointermove", e => {
  if (!pts || Math.hypot(e.clientX - lastPt[0], e.clientY - lastPt[1]) < 4) return;
  lastPt = [e.clientX, e.clientY]; pts.push(toLatLng(e)); lassoLine.setLatLngs(pts);
});
drawLayer.addEventListener("pointerup", () => {
  if (!pts) return;
  const ll = pts; pts = null; map.removeLayer(lassoLine); lassoLine = null;
  if (ll.length < 3) return; // chỉ nhấp/chạm: chưa thành vùng, giữ chế độ vẽ
  setDrawMode(false); setRegion(ll);
});
drawLayer.addEventListener("pointercancel", () => { if (lassoLine) map.removeLayer(lassoLine); lassoLine = null; pts = null; });
// Vẫn cho cuộn chuột để zoom khi đang ở chế độ vẽ
drawLayer.addEventListener("wheel", e => { e.preventDefault(); map.getContainer().dispatchEvent(new WheelEvent("wheel", e)); }, { passive: false });
btnDraw.onclick = () => setDrawMode(!drawMode);
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawMode) setDrawMode(false); });

document.getElementById("filters").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.g; renderFilters(); renderList(); });
document.getElementById("list").addEventListener("click", e => { const b = e.target.closest(".cl"); if (b) select(b.dataset.id); });
document.getElementById("btn-reset").onclick = overview;
document.getElementById("btn-hulls").onclick = e => {
  showAll = !showAll; e.currentTarget.setAttribute("aria-pressed", showAll);
  restyle();
};
document.getElementById("k-stores").textContent = stores.length;
document.getElementById("k-clusters").textContent = CL.length;
document.getElementById("k-noise").textContent = DATA.noise;
renderFilters(); renderList();
select("c3", false);
map.fitBounds(hullLayers.c3.getBounds(), { paddingTopLeft: [60, 70], paddingBottomRight: [innerWidth > 860 ? 400 : 40, 70], maxZoom: 16 });
</script>
</body>
</html>
